<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Quotation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="glass navbar">
        <h2>Thinqloud Q2O</h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="customers.html" class="active">Customers</a>
            <a href="products.html">Products</a>
            <a href="quotations.html">Quotations</a>
            <a href="orders.html">Orders</a>
            <button onclick="logout()" class="btn btn-primary btn-sm" style="margin-left: 1rem;">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="flex-between">
            <h1>Customers</h1>
            <button onclick="openModal('customerModal')" class="btn btn-primary">Add Customer</button>
        </div>
        
        <div style="margin: 1.5rem 0;">
            <input type="text" id="searchInput" class="form-control" placeholder="Search customers..." style="max-width: 300px;">
        </div>

        <div class="glass" style="padding: 1.5rem;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Company</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customersTable">
                        <!-- Rows will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="customerModal" class="modal">
        <div class="glass modal-content">
            <h2 id="modalTitle" style="margin-bottom: 1.5rem;">Add Customer</h2>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="custName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="custCompany" class="form-control">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="custEmail" class="form-control">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="custPhone" class="form-control">
                </div>
                <div class="flex-between" style="margin-top: 2rem;">
                    <button type="button" class="btn" style="background: rgba(255,255,255,0.1); color: white;" onclick="closeModal('customerModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/customers.js"></script>
</body>
</html>
