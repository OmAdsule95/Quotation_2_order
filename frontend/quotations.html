<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotations - Quotation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="glass navbar">
        <h2>Thinqloud Q2O</h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="customers.html">Customers</a>
            <a href="products.html">Products</a>
            <a href="quotations.html" class="active">Quotations</a>
            <a href="orders.html">Orders</a>
            <button onclick="logout()" class="btn btn-primary btn-sm" style="margin-left: 1rem;">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="flex-between">
            <h1>Quotations</h1>
            <a href="quotation-details.html" class="btn btn-primary">Create Quotation</a>
        </div>
        
        <div class="glass" style="padding: 1.5rem; margin-top: 1.5rem;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Number</th>
                            <th>Customer</th>
                            <th>Total Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quotationsTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Manager Approval Modal -->
    <div id="approveModal" class="modal">
        <div class="glass modal-content">
            <h2>Review Quotation</h2>
            <form id="approveForm" style="margin-top: 1rem;">
                <input type="hidden" id="approveQuoteId">
                <div class="form-group">
                    <label>Comments</label>
                    <textarea id="approveComments" class="form-control" rows="3"></textarea>
                </div>
                <div class="flex-between">
                    <button type="button" class="btn btn-danger" onclick="submitReview('REJECTED')">Reject</button>
                    <button type="button" class="btn btn-success" onclick="submitReview('APPROVED')">Approve</button>
                </div>
                <button type="button" class="btn" style="background: rgba(255,255,255,0.1); color: white; width: 100%; margin-top: 1rem;" onclick="closeModal('approveModal')">Cancel</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/quotations.js"></script>
</body>
</html>
