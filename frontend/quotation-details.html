<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quotation - Quotation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="glass navbar">
        <h2>Thinqloud Q2O</h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="customers.html">Customers</a>
            <a href="products.html">Products</a>
            <a href="quotations.html" class="active">Quotations</a>
            <a href="orders.html">Orders</a>
            <button onclick="logout()" class="btn btn-primary btn-sm" style="margin-left: 1rem;">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="flex-between">
            <h1 id="pageTitle">Create Quotation</h1>
            <a href="quotations.html" class="btn" style="background: rgba(255,255,255,0.1); color: white;">Back</a>
        </div>
        
        <div class="glass" style="padding: 2rem; margin-top: 1.5rem;">
            <form id="quoteForm">
                <div class="grid">
                    <div class="form-group">
                        <label>Select Customer</label>
                        <select id="customerId" class="form-control" required></select>
                    </div>
                    <div class="form-group">
                        <label>Discount (%)</label>
                        <input type="number" id="discountPercent" class="form-control" value="0" min="0" max="100">
                    </div>
                </div>

                <div style="margin-top: 2rem;">
                    <div class="flex-between">
                        <h3>Items</h3>
                        <button type="button" onclick="addItem()" class="btn btn-primary btn-sm">+ Add Item</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th>Tax Rate (%)</th>
                                    <th>Quantity</th>
                                    <th>Amount</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="itemsTable">
                                <!-- Items will go here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="grid" style="margin-top: 2rem; justify-content: end; display: flex;">
                    <div style="min-width: 300px;">
                        <div class="flex-between" style="margin-bottom: 0.5rem;">
                            <span>Subtotal:</span>
                            <strong id="dispSubtotal">$0.00</strong>
                        </div>
                        <div class="flex-between" style="margin-bottom: 0.5rem; color: var(--text-secondary);">
                            <span>Discount:</span>
                            <span id="dispDiscount">$0.00</span>
                        </div>
                        <div class="flex-between" style="margin-bottom: 0.5rem; color: var(--text-secondary);">
                            <span>Taxable Amount:</span>
                            <span id="dispTaxable">$0.00</span>
                        </div>
                        <div class="flex-between" style="margin-bottom: 1rem; color: var(--text-secondary);">
                            <span>Tax Amount:</span>
                            <span id="dispTax">$0.00</span>
                        </div>
                        <div class="flex-between" style="border-top: 1px solid var(--border); padding-top: 1rem;">
                            <span style="font-size: 1.25rem;">Grand Total:</span>
                            <strong id="dispGrandTotal" style="font-size: 1.5rem; color: var(--accent);">$0.00</strong>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 2rem; text-align: right;">
                    <button type="submit" id="saveBtn" class="btn btn-primary">Save Quotation</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/quotation-details.js"></script>
</body>
</html>
