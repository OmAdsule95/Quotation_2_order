<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quotation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass login-box">
            <h2>Welcome Back</h2>
            <p>Sign in to your account</p>
            
            <div id="errorMsg" class="alert alert-error"></div>

            <form id="loginForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <div style="margin-top: 2rem; font-size: 0.875rem; color: var(--text-secondary);">
                <p>Test Accounts (Password: password123):</p>
                <p>sales@example.com | admin@example.com | manager@example.com</p>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
