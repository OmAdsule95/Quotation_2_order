<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Quotation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="glass navbar">
        <h2>Thinqloud Q2O</h2>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="customers.html">Customers</a>
            <a href="products.html">Products</a>
            <a href="quotations.html">Quotations</a>
            <a href="orders.html" class="active">Orders</a>
            <button onclick="logout()" class="btn btn-primary btn-sm" style="margin-left: 1rem;">Logout</button>
        </div>
    </nav>

    <div class="container">
        <h1>Orders</h1>
        
        <div class="glass" style="padding: 1.5rem; margin-top: 1.5rem;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Order Number</th>
                            <th>Quotation Ref</th>
                            <th>Customer</th>
                            <th>Total Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Order View Modal -->
    <div id="orderModal" class="modal">
        <div class="glass modal-content" style="max-width: 600px;">
            <h2 id="modalTitle" style="margin-bottom: 1.5rem;">Order Details</h2>
            <div id="orderDetails"></div>
            <div class="flex-between" style="margin-top: 2rem;">
                <button type="button" class="btn" style="background: rgba(255,255,255,0.1); color: white;" onclick="closeModal('orderModal')">Close</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
