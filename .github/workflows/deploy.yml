name: Deploy Quotation-to-Order System

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the latest code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/quotation-order-system:latest .

      # 4. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/quotation-order-system:latest

      # 5. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop quotation-order-system || true
            docker rm quotation-order-system || true

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/quotation-order-system:latest

            docker run -d \
              --name quotation-order-system \
              --env-file ~/quotation.env \
              -p 80:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/quotation-order-system:latest

            docker ps
            docker logs --tail 20 quotation-order-system